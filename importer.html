function log(msg, color) {
  var el = document.getElementById("log");
  var line = document.createElement("div");
  line.style.color = color || "#94a3b8";
  line.textContent = msg;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}
async function clearParts() {
  document.getElementById("btnClear").disabled = true;
  log("กำลังลบข้อมูลเดิม...");
  var snap = await db.collection("parts").get();
  var batch = db.batch();
  var count = 0;
  snap.docs.forEach(function(doc) { batch.delete(doc.ref); count++; });
  await batch.commit();
  log("ลบแล้ว " + count + " รายการ", "#f87171");
  document.getElementById("btnClear").disabled = false;
}
async function startImport() {
  document.getElementById("btnImport").disabled = true;
  document.getElementById("btnClear").style.display = "block";
  log("เริ่ม import " + PARTS.length + " รายการ...", "#60a5fa");
  var BATCH_SIZE = 400;
  var done = 0;
  for (var i = 0; i < PARTS.length; i += BATCH_SIZE) {
    var chunk = PARTS.slice(i, i + BATCH_SIZE);
    var batch = db.batch();
    chunk.forEach(function(p) {
      var ref = db.collection("parts").doc();
      batch.set(ref, p);
    });
    await batch.commit();
    done += chunk.length;
    var pct = Math.round(done / PARTS.length * 100);
    document.getElementById("bar").style.width = pct + "%";
    document.getElementById("stat").textContent = done + " / " + PARTS.length + " รายการ";
    log("batch สำเร็จ: " + done + " รายการ", "#4ade80");
  }
  document.getElementById("stat").textContent = "Import สำเร็จ " + PARTS.length + " รายการ!";
  document.getElementById("stat").style.color = "#4ade80";
  log("เสร็จสมบูรณ์! ปิดหน้านี้แล้วกลับไปใช้ app ได้เลย", "#4ade80");
